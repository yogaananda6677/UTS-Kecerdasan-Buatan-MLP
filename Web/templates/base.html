<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prediksi Penyakit Jantung MLP{% endblock %} - UTS Kecerdasan Buatan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cardio: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-rose-900 selection:text-white">

    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 group">
                <div class="w-8 h-8 rounded-lg bg-rose-600 text-white flex items-center justify-center shadow-sm group-hover:bg-rose-700 transition">
                    <i data-lucide="heart-pulse" class="w-4 h-4"></i>
                </div>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-900 text-base tracking-tight">CardioMLP</span>
                    <span class="text-[11px] font-semibold text-rose-700 bg-rose-50 border border-rose-200 px-2 py-0.5 rounded-full">UTS AI</span>
                </div>
            </a>

            <div class="flex items-center gap-1.5 text-sm font-medium">
                <a href="/" class="px-3 py-1.5 rounded-lg transition {% if request.url.path == '/' %}font-semibold text-slate-900 bg-slate-100{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50{% endif %}">
                    Prediksi
                </a>
                <a href="/komparasi" class="px-3 py-1.5 rounded-lg transition {% if request.url.path == '/komparasi' %}font-semibold text-slate-900 bg-slate-100{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50{% endif %}">
                    Komparasi Jurnal
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-6 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-slate-200 text-xs py-5 text-slate-500">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2.5 text-center sm:text-left">
            <div>
                <span class="font-semibold text-slate-700">Tugas UTS Kecerdasan Buatan</span>
                <span class="mx-1.5 text-slate-300">•</span>
                <span>D3 Manajemen Informatika PSDKU Polinema Kediri</span>
            </div>
            <div class="flex items-center gap-2 text-[11px] text-slate-400">
                <span>Model: MLP ReLU (13 &rarr; 64 &rarr; 32 &rarr; 1)</span>
                <span>•</span>
                <span>Dataset: UCI Cleveland</span>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
